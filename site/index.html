<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b16"><meta name="description" content="Reaction Snake — offline neon arcade game">
<link rel="manifest" href="./manifest.json"><title>Reaction Snake</title>
<style>
:root{color-scheme:dark;--bg:#070b16;--panel:#10182b;--panel2:#151f36;--line:#253451;--cyan:#5ef6e8;--blue:#6d8cff;--pink:#ff68b8;--text:#edf5ff;--muted:#91a2bd}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -20%,#17264a 0%,var(--bg) 58%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);overscroll-behavior:none}.app{width:min(100%,760px);margin:0 auto;padding:18px 0 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#193c53,#1a2348);border:1px solid #3c6475;display:grid;place-items:center;box-shadow:0 0 22px #36e8d322;font-size:23px}.brand h1{font-size:19px;letter-spacing:.08em;margin:0;font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.2em;margin-top:3px}.wallet{border:1px solid #39536b;background:#102234;padding:9px 13px;border-radius:13px;font-weight:800;color:#ffe58a;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.stat,.panel{background:linear-gradient(145deg,#121d33eF,#0d1527f5);border:1px solid var(--line);border-radius:16px}.stat{padding:10px 12px}.stat span{font-size:10px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase}.stat strong{display:block;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}.game-wrap{position:relative;border-radius:20px;padding:10px;background:linear-gradient(135deg,#20324b,#10182a 45%,#1d2c49);border:1px solid #344966;box-shadow:0 16px 45px #0006,0 0 35px #42ead00b}.canvas-box{position:relative;overflow:hidden;border-radius:13px;background:#070e1c;touch-action:none}canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;touch-action:none}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#050a16c9;backdrop-filter:blur(7px);padding:24px}.overlay.show{display:flex}.overlay h2{font-size:28px;margin:0 0 8px}.overlay p{color:var(--muted);margin:0 0 18px}.overlay-card{max-width:290px}.controls{display:flex;gap:9px;margin:12px 0}.btn{border:1px solid #344967;background:linear-gradient(180deg,#1b2a46,#111b30);color:var(--text);border-radius:13px;padding:12px 15px;font-weight:800;font-size:13px;cursor:pointer;min-height:44px;transition:transform .12s,border-color .12s}.btn:active{transform:scale(.97)}.btn.primary{background:linear-gradient(100deg,#087d85,#285b9c);border-color:#4acdc5;box-shadow:0 6px 18px #17b8b32a}.btn.ghost{background:#121c30}.btn:disabled{opacity:.42;cursor:not-allowed}.controls .btn{flex:1}.section-head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section-head h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:0}.section-head small{color:var(--muted)}.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.mode{padding:10px 4px;text-align:center;border-radius:12px;background:#101a2d;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:750;cursor:pointer}.mode.active{color:var(--cyan);border-color:#36c9c1;background:#12313a}.mode b{display:block;font-size:17px;margin-bottom:4px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.bottom .btn{width:100%}.hint{text-align:center;color:#71829f;font-size:11px;margin:13px 0 0}.modal{position:fixed;inset:0;background:#030713d9;z-index:5;display:none;align-items:flex-end;justify-content:center;padding:12px;backdrop-filter:blur(8px)}.modal.open{display:flex}.sheet{width:min(100%,620px);max-height:85dvh;overflow:auto;background:#0d1729;border:1px solid #344967;border-radius:22px;padding:18px;box-shadow:0 20px 80px #0009}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet-head h2{margin:0;font-size:20px}.skins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.skin{border:1px solid var(--line);background:#121e33;border-radius:15px;padding:13px}.skin.selected{border-color:var(--cyan);box-shadow:0 0 0 1px #5ef6e855}.swatch{height:42px;border-radius:10px;margin-bottom:10px;box-shadow:inset 0 0 16px #fff2}.skin strong{display:block;font-size:13px}.skin small{display:block;color:var(--muted);margin:4px 0 10px}.skin .btn{width:100%;padding:9px}.close{width:36px;height:36px;padding:0;font-size:20px}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#172b3b;border:1px solid #3c6973;padding:10px 16px;border-radius:12px;font-size:12px;transition:.2s;z-index:9}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:650px){.app{padding-top:28px}.game-wrap{padding:14px}.canvas-box{max-width:590px;margin:auto}.modal{align-items:center}.sheet{max-height:80vh}.skins{grid-template-columns:repeat(3,1fr)}}@media(max-width:390px){.mode{font-size:10px}.mode b{font-size:15px}.stat strong{font-size:19px}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">✦</div><div><h1>REACTION SNAKE</h1><small>NEON ARCADE SYSTEM</small></div></div><div class="wallet">◆ <span id="coins">0</span></div></header>
<section class="stats"><div class="stat"><span>Score</span><strong id="score">0</strong></div><div class="stat"><span>Best</span><strong id="best">0</strong></div><div class="stat"><span>Reaction</span><strong id="reaction">—</strong></div></section>
<div class="game-wrap"><div class="canvas-box"><canvas id="game" width="600" height="600" aria-label="Snake game board"></canvas><div class="overlay show" id="overlay"><div class="overlay-card"><h2 id="overlayTitle">Ready?</h2><p id="overlayText">Collect energy. Stay sharp.</p><button class="btn primary" id="overlayBtn">START GAME</button></div></div></div></div>
<div class="controls"><button class="btn primary" id="startBtn">▶ PLAY</button><button class="btn" id="pauseBtn">Ⅱ PAUSE</button><button class="btn ghost" id="restartBtn">↻ RESET</button></div>
<div class="section-head"><h2>Game mode</h2><small id="modeInfo">Classic run</small></div>
<div class="modes" id="modes"><button class="mode active" data-mode="classic"><b>∞</b>Classic</button><button class="mode" data-mode="reflex"><b>ϟ</b>Reflex</button><button class="mode" data-mode="survival"><b>◇</b>Survival</button><button class="mode" data-mode="precision"><b>◎</b>Precision</button><button class="mode" data-mode="daily"><b>☼</b>Daily</button></div>
<div class="bottom"><button class="btn" id="shopBtn">✦ SNAKE SKINS</button><button class="btn" id="soundBtn">♪ SOUND: OFF</button></div>
<p class="hint">Swipe or use arrow keys · Space to pause · P to pause</p>
</main>
<div class="modal" id="shop"><div class="sheet"><div class="sheet-head"><div><h2>Snake garage</h2><small style="color:var(--muted)">Unlock a look. Keep it forever.</small></div><button class="btn close" id="closeShop">×</button></div><div class="skins" id="skinList"></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';try{localStorage.removeItem('rs-analytics-visitor');localStorage.removeItem('rs-analytics-queue-v1')}catch{}
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false}),N=24,CELL=25;
const skins=[{id:'mint',name:'Neon Mint',price:0,head:'#a6fff2',body:'#37d9c6',glow:'#39ffe0'},{id:'blue',name:'Cyber Blue',price:60,head:'#d4e3ff',body:'#648cff',glow:'#648cff'},{id:'rose',name:'Laser Rose',price:100,head:'#ffe0f4',body:'#ff68b8',glow:'#ff68b8'},{id:'gold',name:'Solar Gold',price:150,head:'#fff0ad',body:'#f6b83f',glow:'#ffc94f'},{id:'violet',name:'Void Violet',price:220,head:'#eadbff',body:'#9c72ff',glow:'#a47aff'},{id:'fire',name:'Plasma',price:300,head:'#ffe0c5',body:'#ff704d',glow:'#ff704d'},{id:'ice',name:'Arctic',price:380,head:'#e1fbff',body:'#64c9e8',glow:'#8beaff'},{id:'toxic',name:'Toxic',price:450,head:'#efffb0',body:'#9bd83e',glow:'#b6ff45'},{id:'sunset',name:'Sunset',price:520,head:'#ffe0a6',body:'#ff815e',glow:'#ff9c6c'},{id:'matrix',name:'Matrix',price:600,head:'#d0ffd8',body:'#2cbb65',glow:'#44ff87'},{id:'candy',name:'Candy Pop',price:700,head:'#fff0ff',body:'#d77bff',glow:'#ef8dff'},{id:'ocean',name:'Deep Ocean',price:820,head:'#d5faff',body:'#278eb8',glow:'#36cfff'},{id:'ember',name:'Ember',price:950,head:'#fff0dc',body:'#d94b35',glow:'#ff623d'},{id:'mono',name:'Monochrome',price:1100,head:'#ffffff',body:'#aab5c5',glow:'#dce7f7'},{id:'royal',name:'Royal',price:1300,head:'#f8e6ff',body:'#8155d9',glow:'#b17cff'},{id:'glitch',name:'Glitch',price:1600,head:'#fff3fb',body:'#ff3f91',glow:'#50f5ff'}];
const modes={classic:'Classic · walls and tail are dangerous',reflex:'Reflex · speed rises after every snack',survival:'Survival · 3 lives, hazards appear as you score',precision:'Precision · catch each target before it expires',daily:'Daily · same seeded challenge for everyone today'};
let data=load(),mode='classic',snake=[],dir={x:1,y:0},queued=null,food={x:15,y:12},score=0,steps=0,alive=false,paused=false,raf=0,last=0,acc=0,stepMs=145,startedAt=0,lastMoveAt=0,reactionMs=null,sound=false,ended=false,obstacles=[],lives=3,foodAge=0,rngState=1,audioCtx=null,musicTimer=0,musicStep=0;
function load(){try{return Object.assign({coins:0,best:0,owned:['mint'],skin:'mint',games:0,daily:{}},JSON.parse(localStorage.getItem('rs-save')||'{}'))}catch{return {coins:0,best:0,owned:['mint'],skin:'mint',games:0,daily:{}}}}
function save(){try{localStorage.setItem('rs-save',JSON.stringify(data))}catch{}}
function hud(){$('coins').textContent=data.coins;$('best').textContent=mode==='daily'?(data.dailyBest||0):data.best;$('score').textContent=score;$('reaction').textContent=reactionMs==null?'—':reactionMs+' ms';if(mode==='survival')$('modeInfo').textContent='Lives: '+('♥ '.repeat(lives)).trim()}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1700)}
function currentSkin(){return skins.find(s=>s.id===data.skin)||skins[0]}
function draw(){ctx.fillStyle='#071020';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#14223a';ctx.lineWidth=1;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,600);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(600,i*CELL);ctx.stroke()}
const skin=currentSkin();obstacles.forEach(p=>{ctx.fillStyle='#ff557b';ctx.shadowColor='#ff315f';ctx.shadowBlur=9;roundRect(ctx,p.x*CELL+4,p.y*CELL+4,CELL-8,CELL-8,5);ctx.fill()});ctx.shadowBlur=0;ctx.save();ctx.shadowBlur=18;ctx.shadowColor=skin.glow;ctx.fillStyle='#ffcb62';ctx.beginPath();ctx.arc((food.x+.5)*CELL,(food.y+.5)*CELL,8+Math.sin(performance.now()/180)*1.5,0,Math.PI*2);ctx.fill();ctx.restore();
snake.forEach((p,i)=>{const pad=i?3:2;ctx.save();ctx.shadowBlur=i?10:18;ctx.shadowColor=skin.glow;ctx.fillStyle=i?skin.body:skin.head;roundRect(ctx,p.x*CELL+pad,p.y*CELL+pad,CELL-pad*2,CELL-pad*2, i?6:8);ctx.fill();if(!i){ctx.shadowBlur=0;ctx.fillStyle='#071020';ctx.beginPath();ctx.arc(p.x*CELL+9,p.y*CELL+9,2,0,7);ctx.arc(p.x*CELL+16,p.y*CELL+9,2,0,7);ctx.fill()}ctx.restore()})}
function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function random(){if(mode!=='daily')return Math.random();rngState=(rngState*1664525+1013904223)>>>0;return rngState/4294967296}function occupied(x,y){return snake.some(p=>p.x===x&&p.y===y)||obstacles.some(p=>p.x===x&&p.y===y)}function placeFood(){let p,tries=0;do{p={x:Math.floor(random()*N),y:Math.floor(random()*N)};tries++}while(occupied(p.x,p.y)&&tries<900);food=p;foodAge=0}
function reset(){ended=false;snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12},{x:5,y:12}];dir={x:1,y:0};queued=null;score=0;steps=0;reactionMs=null;lives=3;obstacles=[];foodAge=0;stepMs=mode==='reflex'?145:mode==='precision'?125:mode==='survival'?135:145;if(mode==='daily'){const d=new Date();const key=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();rngState=(key^0x5f3759df)>>>0;for(let i=0;i<14;i++){const x=Math.floor(random()*N),y=Math.floor(random()*N);if(!snake.some(p=>p.x===x&&p.y===y))obstacles.push({x,y})}}placeFood();hud();draw()}
function overlay(title,text,button='PLAY'){ $('overlayTitle').textContent=title;$('overlayText').textContent=text;$('overlayBtn').textContent=button;$('overlay').classList.add('show')}
function hideOverlay(){$('overlay').classList.remove('show')}
function start(){if(alive&&!paused)return;if(ended||!snake.length)reset();alive=true;paused=false;last=0;acc=0;startedAt=performance.now();lastMoveAt=startedAt;$('pauseBtn').textContent='Ⅱ PAUSE';hideOverlay();cancelAnimationFrame(raf);if(sound){resumeAudio();startMusic()}raf=requestAnimationFrame(loop)}
function pause(){if(!alive)return;paused=!paused;if(paused){cancelAnimationFrame(raf);stopMusic();$('pauseBtn').textContent='▶ RESUME';overlay('Paused','Your run is safe. Take your time.','RESUME')}else{$('pauseBtn').textContent='Ⅱ PAUSE';hideOverlay();last=0;acc=0;lastMoveAt=performance.now();if(sound){resumeAudio();startMusic()}raf=requestAnimationFrame(loop)}}
function end(won=false){ended=true;alive=false;paused=false;cancelAnimationFrame(raf);stopMusic();data.best=Math.max(data.best,score);if(mode==='daily')data.dailyBest=Math.max(data.dailyBest||0,score);data.games++;save();hud();$('pauseBtn').textContent='Ⅱ PAUSE';if(sound)tone(won?660:150,.18,'sawtooth',.045);overlay(won?'Challenge complete':'Run over',score+' points · '+(mode==='survival'?'survival run':'best score updated'),'TRY AGAIN')}
function loop(t){if(!alive||paused)return;if(!last)last=t;const dt=Math.min(50,t-last);last=t;acc+=dt;let changed=false;while(acc>=stepMs&&alive){acc-=stepMs;tick();changed=true}if(changed)draw();raf=requestAnimationFrame(loop)}
function loseLife(reason){lives--;if(sound)tone(115,.16,'square',.04);if(lives<=0){end();return false}snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12},{x:5,y:12}];dir={x:1,y:0};queued=null;toast(reason+' · '+lives+' lives left');hud();return true}function tick(){if(queued){dir=queued;queued=null}const h=snake[0],n={x:h.x+dir.x,y:h.y+dir.y};steps++;const wall=n.x<0||n.y<0||n.x>=N||n.y>=N,tail=snake.some((p,i)=>i>0&&p.x===n.x&&p.y===n.y),hazard=obstacles.some(p=>p.x===n.x&&p.y===n.y);if(wall||tail||hazard){if(mode==='survival'){if(!loseLife(hazard?'Hazard':'Collision'))return;draw();return}end();return}snake.unshift(n);if(n.x===food.x&&n.y===food.y){score++;if(mode==='daily'){const today=new Date().toISOString().slice(0,10);if(data.dailyRewardDate!==today){data.coins+=5;data.dailyRewardDate=today}}else data.coins+=2;reactionMs=Math.max(1,Math.round(performance.now()-lastMoveAt));lastMoveAt=performance.now();if(sound)tone(520+Math.min(score,12)*24,.075,'sine',.035);if(mode==='reflex')stepMs=Math.max(65,stepMs-7);if(mode==='precision')stepMs=Math.max(82,stepMs-1);if(mode==='survival'&&score%4===0){let p;do{p={x:Math.floor(random()*N),y:Math.floor(random()*N)}}while(occupied(p.x,p.y));obstacles.push(p)}if(mode==='survival'&&score>=20){end(true);return}placeFood();save();hud()}else snake.pop();if(mode==='precision'){foodAge+=stepMs;if(foodAge>=4200){if(sound)tone(190,.09,'triangle',.03);placeFood();toast('Target missed · keep moving')}}if(mode==='daily'&&score>=25){end(true);return}}
function setDirection(x,y,stamp){if(!alive){if(!paused)start();return}if(paused)return;const base=queued||dir;if(x===-base.x&&y===-base.y)return;if(x===base.x&&y===base.y)return;queued={x,y};const now=Number.isFinite(stamp)?stamp:performance.now();if(lastMoveAt)reactionMs=Math.max(1,Math.round(now-lastMoveAt));hud()}
function key(e){const map={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(e.key===' '||e.key.toLowerCase()==='p'){e.preventDefault();if(alive)pause();else start();return}const v=map[e.key];if(v){e.preventDefault();setDirection(v[0],v[1],e.timeStamp)}}
let pointer=null;canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY,t:e.timeStamp};canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!pointer)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18){if(Math.abs(dx)>Math.abs(dy))setDirection(Math.sign(dx),0,e.timeStamp);else setDirection(0,Math.sign(dy),e.timeStamp)}pointer=null});window.addEventListener('keydown',key,{passive:false});
$('startBtn').onclick=start;$('overlayBtn').onclick=()=>{if(alive&&paused)pause();else{reset();start()}};$('pauseBtn').onclick=()=>alive?pause():start();$('restartBtn').onclick=()=>{cancelAnimationFrame(raf);alive=false;paused=false;reset();overlay('Ready?','New run. Good luck!','START GAME')};
$('modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));$('modeInfo').textContent=modes[mode];alive=false;paused=false;cancelAnimationFrame(raf);reset();overlay('Mode changed',modes[mode],'START GAME')});
function shop(){const root=$('skinList');root.innerHTML='';skins.forEach(s=>{const owned=data.owned.includes(s.id),selected=data.skin===s.id,el=document.createElement('article');el.className='skin'+(selected?' selected':'');const sw=document.createElement('div');sw.className='swatch';sw.style.background='linear-gradient(110deg,'+s.head+','+s.body+')';const name=document.createElement('strong');name.textContent=s.name;const info=document.createElement('small');info.textContent=selected?'Equipped':owned?'Unlocked':s.price+' ◆';const btn=document.createElement('button');btn.className='btn'+(selected?' primary':'');btn.textContent=selected?'EQUIPPED':owned?'EQUIP':'UNLOCK';btn.onclick=()=>{if(!owned){if(data.coins<s.price){toast('Not enough coins yet');return}data.coins-=s.price;data.owned.push(s.id)}data.skin=s.id;save();hud();shop();draw();toast(s.name+' equipped')};el.append(sw,name,info,btn);root.append(el)})}
$('shopBtn').onclick=()=>{$('shop').classList.add('open');shop()};$('closeShop').onclick=()=>$('shop').classList.remove('open');$('shop').addEventListener('click',e=>{if(e.target===$('shop'))$('shop').classList.remove('open')});
function resumeAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}function tone(freq,duration,type='sine',volume=.035){if(!sound)return;try{resumeAudio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}function stopMusic(){if(musicTimer){clearTimeout(musicTimer);musicTimer=0}}function startMusic(){stopMusic();if(!sound||!alive||paused)return;const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];const play=()=>{if(!sound||!alive||paused)return;tone(notes[musicStep%notes.length],.22,'triangle',.012);musicStep++;musicTimer=setTimeout(play,360)};play()}$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent='♪ SOUND: '+(sound?'ON':'OFF');if(sound){resumeAudio();if(alive&&!paused)startMusic();tone(660,.1,'sine',.04);toast('Sound and music enabled')}else{stopMusic();toast('Sound muted')}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&alive&&!paused)pause()});
reset();hud();if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
})();
</script>
</body></html>
