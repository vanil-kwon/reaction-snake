name: Deploy site from ZIP or source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p site
          if [ -f site/index.html ]; then
            echo "Using source site directory"
          else
            ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
            test -n "$ZIP_FILE"
            unzip -o "$ZIP_FILE" -d site
          fi
          test -f site/index.html
      - name: Validate JavaScript
        run: |
          node --check site/service-worker.js
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const html = fs.readFileSync('site/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline game script found');
          for (const [index, match] of scripts.entries()) {
            const tempFile = `/tmp/reaction-snake-inline-${index + 1}.js`;
            fs.writeFileSync(tempFile, match[1]);
            execFileSync('node', ['--check', tempFile], { stdio: 'inherit' });
            new Function(match[1]);
            console.log('Validated inline script', index + 1);
          }
          NODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for artifact indexing
        run: sleep 8
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
