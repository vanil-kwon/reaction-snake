name: Validate and deploy Reaction Snake
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p site
          if [ -f site/index.html ]; then
            echo "Using source site directory"
          else
            ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
            test -n "$ZIP_FILE"
            unzip -o "$ZIP_FILE" -d site
          fi
          test -f site/index.html
      - name: Validate release
        run: |
          node --check site/service-worker.js
          node --check scripts/validate-release.js
          node scripts/validate-release.js
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p site
          if [ -f site/index.html ]; then
            echo "Using source site directory"
          else
            ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
            test -n "$ZIP_FILE"
            unzip -o "$ZIP_FILE" -d site
          fi
          test -f site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for artifact indexing
        run: sleep 8
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
