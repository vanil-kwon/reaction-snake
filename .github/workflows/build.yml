name: Build ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ZIP
        run: zip -r reaction-snake.zip . -x ".git/*" ".github/*"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: reaction-snake
          path: reaction-snake.zip
